version: '3.8'

services:
  # ==========================================
  # 1. 로컬 개발용 DB (PostgreSQL)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: moa-postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: moa
      POSTGRES_USER: moa
      POSTGRES_PASSWORD: moa1234
      TZ: Asia/Seoul
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    restart: always

  # ==========================================
  # 2. 로컬 캐시 & 분산 락 (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: moa-redis-local
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-local-data:/data
    restart: always

  # ==========================================
  # 3. 로컬 메트릭 수집기 (Prometheus)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: moa-prometheus-local
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # k6 Docker 가 experimental-prometheus-rw 로 메트릭 푸시할 때 필요
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms'
    restart: always

  # ==========================================
  # 4. 로컬 시각화 레이더 (Grafana)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: moa-grafana-local
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-local-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./k6.json:/dashboard/k6.json:ro
    depends_on:
      - prometheus
    restart: always

  # ==========================================
  # 5. k6 부하 (선택) — Prometheus remote-write + 호스트의 스프링 API
  #    실행: docker compose --profile load run --rm k6
  #    스프링은 호스트에서 8080 (dev), DB/Redis 는 compose 의 postgres/redis 사용
  # ==========================================
  k6:
    profiles:
      - load
    image: grafana/k6:latest
    container_name: moa-k6-load
    working_dir: /scripts
    volumes:
      - ./k6:/scripts
    command: run -o experimental-prometheus-rw /scripts/k6-load-test.js
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      - BASE_URL=http://host.docker.internal:8080
      - TOKENS_FILE=tokens.json
      - K6_REPORT_DIR=/scripts/reports
      # Grafana 대시보드 testid 드롭다운 필터. 다른 값 쓰려면: K6_TEST_ID=my-run
      - K6_TEST_ID=moa-order
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - prometheus
    restart: 'no'

volumes:
  postgres-local-data:
  redis-local-data:
  grafana-local-data:
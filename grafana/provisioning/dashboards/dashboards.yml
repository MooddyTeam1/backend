# 루트의 k6.json 을 /dashboard 로 마운트해 자동 로드 (Grafana Labs k6 Prometheus Native Histograms)
apiVersion: 1

providers:
  - name: k6-dashboards
    orgId: 1
    folder: K6
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /dashboard
      foldersFromFilesStructure: true

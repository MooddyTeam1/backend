# Gradle Worker(ClassNotFoundException: GradleWorkerMain) 완화
# - 병렬/워커 제한 + UTF-8
# - java.io.tmpdir 을 ASCII 경로로 두면(한글 사용자명 TEMP) 테스트 워커 파이프 오류가 줄어드는 경우가 있음
#   → C:\gradle-moa-tmp 폴더를 미리 만들어 둘 것(없으면 export-tokens 스크립트가 생성)
# - 여전히 실패하면: 기존 캐시 손상 또는 프로젝트 경로(한글 등) 이슈 가능
#   → PowerShell 예: .\gradlew.bat -g C:\gradle-moa-cache compileJava
#   → 또는 %USERPROFILE%\.gradle\caches 폴더 삭제 후 재시도
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx2048m "-Djava.io.tmpdir=C:/gradle-moa-tmp"
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true

# (선택) TokenExportTest / 서버와 동일한 JWT 시크릿 — OS에 JWT_SECRET 이 없을 때만 사용. 커밋하지 말 것.
# jwtSecret=change-me-to-secure-key-change-this-in-prod

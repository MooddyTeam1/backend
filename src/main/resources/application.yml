# src/main/resources/application.yml
spring:
  application:
    name: moa-backend
  profiles:
    # 기본 실행 프로필을 dev(로컬 개발)로 강제 지정
    active: dev

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 32MB

  # 공통 OAuth2 설정 (시크릿 키는 환경변수로 주입)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [profile, email]
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: [profile_nickname, profile_image]
            provider: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # 이메일 발송 기본 설정
  mail:
    host: smtp.naver.com
    port: 587
    username: ${NAVER_MAIL_USERNAME}
    password: ${NAVER_MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

# 공통 토큰 & 외부 API 설정 (콜론 뒤 기본값은 build.gradle 의 defaultJwtSecret 과 동일하게 유지)
jwt:
  secret: ${JWT_SECRET:change-me-to-secure-key-change-this-in-prod}
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 1209600
  issuer: moa-backend

toss:
  client-key: ${TOSS_CLIENT_KEY}
  secret-key: ${TOSS_SECRET_KEY}

openai:
  base-url: https://api.openai.com
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

app:
  email:
    verification-expiration-minutes: 10
  password-reset:
    token-validity-minutes: 60
  file-storage:
    image-dir: images
server:
  tomcat:
    threads:
      max: 200 # 동시에 일할 일꾼 늘리기
    accept-count: 1000 # 대기열 늘리기
    max-connections: 10000 # 최대 연결 수 늘리기
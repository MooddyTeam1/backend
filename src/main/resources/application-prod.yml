# src/main/resources/application-prod.yml
spring:
  config:
    activate:
      on-profile: prod

  # 운영 DB 연결 (RDS 또는 EC2 내부 DB)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moa_system}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:moa_system}
    password: ${DB_PASSWORD:changeme}

  # 운영 Redis 연결 (ElastiCache 또는 EC2 내부 Redis)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate # 운영에서는 절대 update나 create를 쓰지 않는다.
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never # 운영에선 더미 데이터 자동 삽입 금지

  # 운영 OAuth2 리다이렉트 URI
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: ${GOOGLE_REDIRECT_URI:https://api.moa.com/login/oauth2/code/google}
          kakao:
            redirect-uri: ${KAKAO_REDIRECT_URI:https://api.moa.com/login/oauth2/code/kakao}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: moa-backend-prod

logging:
  level:
    org.springframework.security.oauth2.client: INFO
    org.springframework.web.client.RestTemplate: INFO
    com.moa.backend: INFO # 운영은 디버그 로그 제거

app:
  frontend:
    base-url: ${FRONTEND_URL:https://moa-frontend.vercel.app}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:https://moa-frontend.vercel.app/password/reset}
  file-storage:
    root-dir: ${APP_FILE_ROOT_DIR:/home/ubuntu/app/uploads}